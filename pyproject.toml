[tool.poetry]
name = "vectorgebra"
version = "4.0.0-beta1"
description = "A numerical methods tool for python, in python."
authors = ["Ahmet Erdem <ahmetblk1035@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11"

[tool.poetry.dev-dependencies]
pdoc = ">=0.10.0"
myst-parser = ">=0.18.0"
pytest = "^8.0.0"
numpy = ">=1.20.0"
tox = ">=4.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"